name: Atualizar Cardápio RU UnB

on:
  schedule:
    # Roda todos os dias às 09:00 UTC (06:00 horário de Brasília)
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar scraper do RU UnB
        run: |
          python parser/scrape_unb_ru.py
          cp parser/menu_*.json app/src/main/assets/ || true
          mkdir -p web/data
          cp parser/menu_*.json web/data/ || true

      - name: Commit e Push se houver alterações
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add parser/menu_*.json app/src/main/assets/menu_*.json web/data/menu_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cardapio): atualizar cardapio semanal [skip ci]" && git push)
