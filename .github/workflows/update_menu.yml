name: Atualizar Cardápio RU UnB

on:
  schedule:
    # Roda a cada 2 horas aos domingos e segundas (dias de virada do cardápio semanal no RU UnB)
    # 09, 11, 13, 15, 17, 19, 21 UTC = 06, 08, 10, 12, 14, 16, 18 Horário de Brasília
    - cron: '0 9,11,13,15,17,19,21 * * 0,1'
    # Roda 2x ao dia de terça a sábado para capturar eventuais atualizações ou retificações
    # 09 e 15 UTC = 06 e 12 Horário de Brasília
    - cron: '0 9,15 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt

      - name: Executar scraper do RU UnB
        run: |
          python parser/scrape_unb_ru.py
          cp parser/menu_*.json app/src/main/assets/ || true
          mkdir -p web/data
          cp parser/menu_*.json web/data/ || true
          cp parser/menu_*.json web/ || true

      - name: Commit e Push se houver alterações
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add parser/menu_*.json app/src/main/assets/menu_*.json web/data/menu_*.json web/menu_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cardapio): atualizar cardapio semanal" && git push)
